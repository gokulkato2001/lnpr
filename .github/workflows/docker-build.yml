# # Additonal branches implementation

name: Build and Push to GHCR

on:
  push:
    branches: 
      - main
      - optimized
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/event_listener

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Determine image tag
      id: vars
      run: |
        branch_or_tag="${GITHUB_REF##*/}"
        if [[ "$branch_or_tag" == "main" ]]; then
          echo "tag=latest" >> $GITHUB_OUTPUT
        elif [[ "$branch_or_tag" == "optimized" ]]; then
          echo "tag=optimized" >> $GITHUB_OUTPUT
        else
          echo "tag=${branch_or_tag}" >> $GITHUB_OUTPUT
        fi

    - name: Login to GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
