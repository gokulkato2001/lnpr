version: '3.8'

services:
  event_listener:
    # image: ghcr.io/gokulkato2001/event_listener:latest
    build: .
    pull_policy: always
    container_name: event_listener
    environment:
      RABBITMQ_URL: amqp://guest:guest@139.84.130.70:5672/
      RABBITMQ_QUEUE: lpr_data
      LPR_PUBLISH_QUEUE: lpr_detection_queue
      SDK_URL: http://31.97.202.17:8080/v1/plate-reader/
      API_KEY: 4478d74ca90ad82a3a73bd309d8a0f4888bad9b8
      FRAME_SKIP: 10
      CONF_THRESHOLD: 0.8
      MAX_CHAR_DIFF: 2
    volumes:
      - ./received_events:/app/received_events
      - ./lnpr_outputs:/app/lnpr_outputs
    restart: unless-stopped
